name: build-and-publish
on:
  push:
    branches:
      - main 

jobs:
  publish-nuget:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # 启用 OIDC Token
      contents: read    # 读取仓库内容

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x
      
      - name: Check commit message for version
        id: check_version
        run: |
          if git log -1 --pretty=%B | grep -E "pushv[0-9]+\.[0-9]+\.[0-9]+"; then
            echo "match=true" >> $GITHUB_OUTPUT
          else
            echo "match=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release .\HKW.ReactiveUI\HKW.ReactiveUI.csproj

      - name: Pack
        run: dotnet pack --configuration Release HKW.ReactiveUI

      # 登录并获取临时 API Key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: Hakoyu   # NuGet.org 用户名
          token-service-url: https://www.nuget.org/api/v2/token
          audience: https://www.nuget.org

      # 推送到 NuGet.org
      - name: NuGet push
        run: dotnet nuget push "./HKW.ReactiveUI/bin/Release/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json" --skip-duplicate
